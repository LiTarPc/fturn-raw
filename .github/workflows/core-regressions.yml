name: Core regressions
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: RAW and authorization race regressions
        run: go test -race -mod=readonly ./internal/rawsocks ./internal/rawvpn ./internal/transport/turndial ./internal/captchaipc ./internal/provider/vk/... -count=1 -timeout=10m
      - name: TURN dependency race regressions
        run: go -C third_party/turn test -race ./... -count=1 -timeout=5m
      - name: smux dependency race regressions
        run: go -C third_party/smux test -race ./... -count=1 -timeout=5m
