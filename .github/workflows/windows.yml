name: Raw core release
on:
  push:
    branches: [codex/core-1.1.0]
    tags: [v1.1.0]
  workflow_dispatch:
permissions:
  contents: read
env:
  GO_VERSION: '1.26.10'
  GOTOOLCHAIN: local
concurrency:
  group: raw-core-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact release source
        run: python scripts/verify-core-source.py
      - name: Core tests
        run: go test -mod=readonly ./... -count=1 -timeout=5m
      - name: Go vet
        run: go vet -mod=readonly ./...
      - name: Repeated orderly cancellation and deterministic shutdown regressions
        run: go test -mod=readonly ./internal/rawvpn -run '^(TestOrderlyClientCancellationReleasesSlot|TestCancellationDeadlineIsJoinedBeforeGoodbye|TestStoppingCancellationDeadlineTwicePreventsCallback|TestCancellationDeadlineStillInterruptsActiveWrite|TestReadClientPacketChecksCancellationAfterDeadline|TestReadClientPacketStillReadsLiveContext)$' -count=100 -timeout=5m
      - name: Browser capture offline fixture
        run: node internal/provider/vk/internal/captcha/manual/inject_fixture_test.cjs
      - name: Shared bypass tests
        working-directory: shared/bypass
        run: go test ./... -count=1
      - name: TURN fork tests
        working-directory: third_party/turn
        run: go test ./... -count=1 -timeout=5m
      - name: Linux core race gate
        if: runner.os == 'Linux'
        run: go test -race ./internal/rawvpn ./internal/rawsocks ./internal/transport/turndial ./internal/provider/vk/internal/captcha/... ./internal/provider/vk/internal/vkauth -count=1 -timeout=5m
      - name: TURN race gate
        if: runner.os == 'Linux'
        working-directory: third_party/turn
        run: go test -race ./... -count=1 -timeout=5m
  platform-clients:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build Linux and Android clients
        shell: pwsh
        run: ./scripts/build-platform-clients.ps1
      - name: Validate and package clients
        run: |
          python3 scripts/package-platform-clients.py
          cp dist/platform-clients/android-arm64-vpnservice/arm64-v8a/libfturnraw.so dist/libfturnraw.so
          dist/platform-clients/linux-amd64/raw-client --version
          dist/platform-clients/linux-amd64/raw-client --help
      - uses: actions/upload-artifact@v4
        with:
          name: core-platform-clients
          path: |
            dist/fturn-raw-client-*.zip
            dist/CLIENT-SHA256SUMS
            dist/libfturnraw.so
          if-no-files-found: error
  windows-core:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build Windows CLI core and matching Wintun
        shell: pwsh
        run: ./scripts/build-core-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: core-windows-client
          path: |
            dist/fturn-raw-client-1.1.0-windows-amd64.zip
            dist/CLIENT-SHA256SUMS-windows-amd64
          if-no-files-found: error
  servers:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: windows-amd64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Native server protocol checks
        run: go test ./internal/rawvpn ./internal/config ./cmd/raw-server -count=1 -timeout=5m
      - name: Build and validate server package
        shell: pwsh
        env:
          SERVER_TARGET: ${{ matrix.target }}
        run: |
          ./scripts/build-raw-server.ps1 -Version 1.1.0 -Targets $env:SERVER_TARGET
          ./scripts/test-raw-server-packages.ps1 -Version 1.1.0 -Targets $env:SERVER_TARGET
      - uses: actions/upload-artifact@v4
        with:
          name: core-server-${{ matrix.target }}
          path: |
            dist/fturn-raw-server-1.1.0-${{ matrix.target }}.zip
            dist/SERVER-SHA256SUMS-${{ matrix.target }}
          if-no-files-found: error
  release-files:
    needs: [verify, platform-clients, windows-core, servers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: core-*
          merge-multiple: true
          path: release
      - name: Verify complete release attachments and checksums
        run: |
          python3 scripts/stage-core-release.py
          cd release
          sha256sum --check --strict SHA256SUMS
          bash -n quick-start.sh
      - uses: actions/upload-artifact@v4
        with:
          name: core-release-verified
          path: release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release-files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core-release-verified
          path: release
      - name: Check downloaded artifact
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS
      - name: Publish stable core release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > existing-draft.txt; then
            if [ "$(cat existing-draft.txt)" = false ]; then
              echo "Published release exists; preserving its assets."
              exit 0
            fi
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --verify-tag --draft --title "FturnRaw $TAG — client and server cores" --notes-file "docs/releases/$TAG.md"
          fi
          expected=$(find release -maxdepth 1 -type f | wc -l)
          actual=$(gh release view "$TAG" --json assets --jq '.assets | length')
          test "$expected" -eq "$actual"
          gh release edit "$TAG" --draft=false --prerelease=false --latest=false
