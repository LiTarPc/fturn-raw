name: Raw packages
on:
  push:
    branches: [main, codex/raw-1.0.0]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raw-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  package-plan:
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.plan.outputs.servers }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          python3 - <<'PY'
          import json, os
          plan = json.load(open('scripts/ci/release-plan.json', encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('servers=' + str(bool(plan['serverPackages'])).lower() + '\n')
          PY
  platform-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Native Linux transport checks
        run: go test ./internal/rawvpn ./internal/config ./internal/session ./cmd/raw-client ./cmd/raw-server
      - name: Build Linux and Android clients
        shell: pwsh
        run: ./scripts/build-platform-clients.ps1
      - name: Package and verify platform clients
        run: python3 scripts/package-platform-clients.py
      - name: Check Linux executable
        run: |
          dist/platform-clients/linux-amd64/raw-client --version
          dist/platform-clients/linux-amd64/raw-client --help
      - uses: actions/upload-artifact@v4
        with:
          name: fturn-raw-platform-clients
          path: |
            dist/fturn-raw-client-*.zip
            dist/CLIENT-SHA256SUMS
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: |
            go.sum
            ui/newservice/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/newservice/frontend/package-lock.json
      - name: Install build tools
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          choco install nsis --yes --no-progress
          Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\NSIS"
          Add-Content $env:GITHUB_PATH "$(go env GOPATH)\bin"
      - name: Protocol tests
        shell: pwsh
        run: |
          go test ./internal/bypass ./internal/rawvpn ./cmd/raw-server ./internal/session ./internal/config ./internal/provider/vk/...
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed' }
          Push-Location shared/bypass
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Bypass rule tests failed' }
          Pop-Location
      - name: Native DNS firewall filter checks
        shell: pwsh
        run: ./scripts/test-raw-dns-firewall-native.ps1
      - name: Build installer
        shell: pwsh
        run: |
          $version=(Get-Content ui/newservice/wails.json -Raw | ConvertFrom-Json).info.productVersion
          $coreVersion=(Get-Content internal/buildinfo/core-version.txt -Raw).Trim()
          $serverVersion=(Get-Content internal/buildinfo/server-version.txt -Raw).Trim()
          if ($coreVersion -ne $serverVersion) { throw 'Client and server core release versions must match' }
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne ('v'+$coreVersion)) { throw 'Tag and core release version must match' }
          ./scripts/build-raw-installer.ps1 -Version $version -OutputFile "$pwd/dist/fturn-raw-$coreVersion-windows-x64-setup.exe"
          Copy-Item dist/fturn-raw-windows-ui-newservice.zip "dist/fturn-raw-$coreVersion-windows-x64-portable.zip"
          $lines=Get-ChildItem dist/*-windows-x64-setup.exe,dist/*-windows-x64-portable.zip | ForEach-Object { ((Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant())+'  '+$_.Name }
          $lines | Set-Content dist/SHA256SUMS -Encoding ascii
      - name: Installer regression checks
        shell: pwsh
        run: |
          ./scripts/test-raw-installer-support.ps1
          ./scripts/test-raw-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: fturn-raw-windows-x64
          path: |
            dist/*-windows-x64-setup.exe
            dist/*-windows-x64-portable.zip
            dist/SHA256SUMS
          if-no-files-found: error
  servers:
    needs: package-plan
    if: needs.package-plan.outputs.servers == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: windows-amd64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Server protocol tests
        shell: pwsh
        run: |
          go test ./internal/rawvpn ./internal/config ./cmd/raw-server
          if ($LASTEXITCODE -ne 0) { throw 'Server tests failed' }
      - name: Build and validate server package
        shell: pwsh
        env:
          SERVER_TARGET: ${{ matrix.target }}
        run: |
          $version=(Get-Content internal/buildinfo/server-version.txt -Raw).Trim()
          ./scripts/build-raw-server.ps1 -Version $version -Targets $env:SERVER_TARGET
          ./scripts/test-raw-server-packages.ps1 -Version $version -Targets $env:SERVER_TARGET
      - uses: actions/upload-artifact@v4
        with:
          name: fturn-raw-server-${{ matrix.target }}
          path: |
            dist/fturn-raw-server-*-${{ matrix.target }}.zip
            dist/SERVER-SHA256SUMS-${{ matrix.target }}
          if-no-files-found: error
  release:
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.windows.result == 'success' && needs.platform-clients.result == 'success' && needs.servers.result == 'success'
    needs: [windows, servers, platform-clients]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fturn-raw-platform-clients
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: fturn-raw-windows-x64
          path: release
      - uses: actions/download-artifact@v4
        if: needs.servers.result == 'success'
        with:
          pattern: fturn-raw-server-*
          merge-multiple: true
          path: release
      - name: Merge server checksums
        if: needs.servers.result == 'success'
        run: |
          cat release/SERVER-SHA256SUMS-* | sort > release/SERVER-SHA256SUMS
          rm release/SERVER-SHA256SUMS-linux-amd64 release/SERVER-SHA256SUMS-linux-arm64 release/SERVER-SHA256SUMS-windows-amd64
      - name: Verify complete release checksums
        working-directory: release
        run: |
          cat SHA256SUMS CLIENT-SHA256SUMS SERVER-SHA256SUMS | sort > SHA256SUMS.all
          mv SHA256SUMS.all SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > existing-draft.txt; then
            if [ "$(cat existing-draft.txt)" = false ]; then
              echo "Release already published; preserving its assets."
              exit 0
            fi
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --verify-tag --draft --title "FturnRaw $TAG — до трёх устройств на один ключ" --notes-file "docs/releases/$TAG.md"
          fi
          expected=$(find release -maxdepth 1 -type f | wc -l)
          actual=$(gh release view "$TAG" --json assets --jq '.assets | length')
          test "$expected" -eq "$actual"
          gh release edit "$TAG" --draft=false --latest
