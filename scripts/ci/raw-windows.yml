name: Windows Raw
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raw-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: |
            go.sum
            ui/newservice/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/newservice/frontend/package-lock.json
      - name: Install build tools
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          choco install nsis --yes --no-progress
          Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\NSIS"
          Add-Content $env:GITHUB_PATH "$(go env GOPATH)\bin"
      - name: Protocol tests
        shell: pwsh
        run: |
          go test ./internal/rawvpn ./internal/session ./internal/config
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed' }
      - name: Build installer
        shell: pwsh
        run: |
          $version=(Get-Content ui/newservice/wails.json -Raw | ConvertFrom-Json).info.productVersion
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne ('v'+$version)) { throw 'Tag and product version must match' }
          ./scripts/build-raw-installer.ps1 -Version $version
          Copy-Item dist/fturn-raw-windows-ui-newservice.zip "dist/fturn-raw-$version-windows-x64-portable.zip"
          $lines=Get-ChildItem dist/*-windows-x64-setup.exe,dist/*-windows-x64-portable.zip | ForEach-Object { ((Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant())+'  '+$_.Name }
          $lines | Set-Content dist/SHA256SUMS -Encoding ascii
      - name: Installer regression checks
        shell: pwsh
        run: |
          ./scripts/test-raw-installer-support.ps1
          ./scripts/test-raw-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: fturn-raw-windows-x64
          path: |
            dist/*-windows-x64-setup.exe
            dist/*-windows-x64-portable.zip
            dist/SHA256SUMS
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fturn-raw-windows-x64
          path: release
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving published assets."
            exit 0
          fi
          gh release create "$TAG" release/* --verify-tag --prerelease --title "fturn Raw $TAG" --notes "Experimental Windows x64 client: NSIS installer, portable ZIP, and SHA256SUMS. Profiles are stored in LocalAppData and preserved on upgrade/uninstall. Close the client via the tray before installing. The application and installer are currently unsigned."
