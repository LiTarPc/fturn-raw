name: Raw packages
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raw-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  package-plan:
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.plan.outputs.servers }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          python3 - <<'PY'
          import json, os
          plan = json.load(open('scripts/ci/release-plan.json', encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('servers=' + str(bool(plan['serverPackages'])).lower() + '\n')
          PY
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: |
            go.sum
            ui/newservice/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/newservice/frontend/package-lock.json
      - name: Install build tools
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          choco install nsis --yes --no-progress
          Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\NSIS"
          Add-Content $env:GITHUB_PATH "$(go env GOPATH)\bin"
      - name: Protocol tests
        shell: pwsh
        run: |
          go test ./internal/bypass ./internal/rawvpn ./internal/session ./internal/config ./internal/provider/vk/...
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed' }
          Push-Location shared/bypass
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Bypass rule tests failed' }
          Pop-Location
      - name: Build installer
        shell: pwsh
        run: |
          $version=(Get-Content ui/newservice/wails.json -Raw | ConvertFrom-Json).info.productVersion
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne ('v'+$version)) { throw 'Tag and product version must match' }
          ./scripts/build-raw-installer.ps1 -Version $version
          Copy-Item dist/fturn-raw-windows-ui-newservice.zip "dist/fturn-raw-$version-windows-x64-portable.zip"
          $lines=Get-ChildItem dist/*-windows-x64-setup.exe,dist/*-windows-x64-portable.zip | ForEach-Object { ((Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant())+'  '+$_.Name }
          $lines | Set-Content dist/SHA256SUMS -Encoding ascii
      - name: Installer regression checks
        shell: pwsh
        run: |
          ./scripts/test-raw-installer-support.ps1
          ./scripts/test-raw-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: fturn-raw-windows-x64
          path: |
            dist/*-windows-x64-setup.exe
            dist/*-windows-x64-portable.zip
            dist/SHA256SUMS
          if-no-files-found: error
  servers:
    needs: package-plan
    if: needs.package-plan.outputs.servers == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: windows-amd64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Server protocol tests
        shell: pwsh
        run: |
          go test ./internal/rawvpn ./internal/config ./cmd/raw-server
          if ($LASTEXITCODE -ne 0) { throw 'Server tests failed' }
      - name: Build and validate server package
        shell: pwsh
        env:
          SERVER_TARGET: ${{ matrix.target }}
        run: |
          $version=(Get-Content ui/newservice/wails.json -Raw | ConvertFrom-Json).info.productVersion
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne ('v'+$version)) { throw 'Tag and product version must match' }
          ./scripts/build-raw-server.ps1 -Version $version -Targets $env:SERVER_TARGET
          ./scripts/test-raw-server-packages.ps1 -Version $version -Targets $env:SERVER_TARGET
      - uses: actions/upload-artifact@v4
        with:
          name: fturn-raw-server-${{ matrix.target }}
          path: |
            dist/fturn-raw-server-*-${{ matrix.target }}.zip
            dist/SERVER-SHA256SUMS-${{ matrix.target }}
          if-no-files-found: error
  release:
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.windows.result == 'success' && (needs.servers.result == 'success' || needs.servers.result == 'skipped')
    needs: [windows, servers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fturn-raw-windows-x64
          path: release
      - uses: actions/download-artifact@v4
        if: needs.servers.result == 'success'
        with:
          pattern: fturn-raw-server-*
          merge-multiple: true
          path: release
      - name: Merge server checksums
        if: needs.servers.result == 'success'
        run: |
          cat release/SERVER-SHA256SUMS-* | sort > release/SERVER-SHA256SUMS
          rm release/SERVER-SHA256SUMS-linux-amd64 release/SERVER-SHA256SUMS-linux-arm64 release/SERVER-SHA256SUMS-windows-amd64
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving published assets."
            exit 0
          fi
          gh release create "$TAG" release/* --verify-tag --prerelease --title "fturn Raw $TAG" --notes "Experimental Windows x64 client (NSIS and portable) and SHA256 manifest. Optional server packages are controlled by the release plan. Profiles are stored in LocalAppData and preserved on upgrade/uninstall. Close the client via the tray before installing. The application and installer are currently unsigned."
